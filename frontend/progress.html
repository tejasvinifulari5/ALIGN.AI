<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALIGN.AI — Progress</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/progress.css"/>
</head>
<body>

  <header class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1>My Progress</h1>
    <span class="session-badge" id="sessionBadge">0 sessions</span>
  </header>

  <div class="page">

    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-dumbbell"></i></div>
        <div>
          <div class="stat-num" id="hTotal">0</div>
          <div class="stat-lbl">Total Workouts</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-star"></i></div>
        <div>
          <div class="stat-num" id="hBest">—</div>
          <div class="stat-lbl">Best Score</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-fire"></i></div>
        <div>
          <div class="stat-num" id="hReps">0</div>
          <div class="stat-lbl">Total Reps</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-chart-simple"></i></div>
        <div>
          <div class="stat-num" id="hAvg">—</div>
          <div class="stat-lbl">Avg Score</div>
        </div>
      </div>
    </div>

    <!-- Score + Pie -->
    <div class="chart-grid">
      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="icon"><i class="fas fa-chart-line"></i></span>
            Score Over Time
          </div>
          <div class="pills">
            <button class="pill on" onclick="filterScore('all',this)">All</button>
            <button class="pill" onclick="filterScore('squats',this)">Squats</button>
            <button class="pill" onclick="filterScore('bicep curls',this)">Bicep Curls</button>
            <button class="pill" onclick="filterScore('pushups',this)">Pushups</button>
          </div>
        </div>
        <div class="card-body">
          <canvas id="scoreChart" height="110"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">
            <span class="icon"><i class="fas fa-layer-group"></i></span>
            Exercise Split
          </div>
        </div>
        <div class="card-body">
          <div class="pie-layout">
            <canvas id="pieChart"></canvas>
            <div id="pieLegend"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Reps -->
    <div class="card mb">
      <div class="card-head">
        <div class="card-title">
          <span class="icon"><i class="fas fa-repeat"></i></span>
          Reps Per Session
        </div>
      </div>
      <div class="card-body">
        <canvas id="repsChart" height="80"></canvas>
      </div>
    </div>

    <!-- History -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">
          <span class="icon"><i class="fas fa-clock-rotate-left"></i></span>
          Session History
        </div>
      </div>
      <div id="histWrap"></div>
    </div>

  </div>

  <script src="js/progress.js"></script>
</body>
</html>
